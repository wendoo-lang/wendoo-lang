name: Release vscode-extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-vscode-extension

jobs:
  release:
    name: Build, Verify, Publish & Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        working-directory: .
        run: |
          set -euo pipefail
          order="$(node scripts/build-packages.js --order apps/vscode-extension)"
          for dir in $order; do
            (cd "$dir" && npm ci)
          done

      - name: Build local packages
        run: npm run build:deps

      - name: Lint & format check
        run: npm run check:only

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bump version
        run: |
          npm version "${{ inputs.bump }}" --git-tag-version=false
          echo "RELEASE_TAG=wendoo-vscode-extension-v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Package
        run: npx vsce package --no-dependencies --out release.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath release.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Commit, tag & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "$RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" release.vsix \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
