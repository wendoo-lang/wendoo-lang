name: Debug OIDC claims
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  show-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          RESP=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$RESP" | jq -r .value | cut -d. -f2)
          python3 -c "import base64,json,sys;p=sys.argv[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('iss','aud','sub','repository','repository_owner','ref')},indent=1))" "$PAYLOAD"
