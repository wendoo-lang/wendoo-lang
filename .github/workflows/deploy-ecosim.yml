name: Deploy ecosim

on:
  push:
    tags:
      - "ecosim-v*"

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: sim.mindcraft-lang.org
  AWS_REGION: us-east-1
  CLOUDFRONT_DISTRIBUTION_ID: E26PTP5MZD6SJC

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        run: npm run install:packages

      - name: Install ecosim dependencies
        working-directory: apps/ecosim
        run: |
          rm -f package-lock.json
          npm install

      - name: Build packages
        working-directory: apps/ecosim
        run: npm run build:deps

      - name: Build ecosim
        working-directory: apps/ecosim
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync apps/ecosim/dist "s3://$S3_BUCKET" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
