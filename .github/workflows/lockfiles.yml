name: Lockfiles

on:
  push:
    branches: ["**"]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/lockfiles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Every lockfile matches its package.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # Regenerates each lockfile from its package.json and compares, leaving
      # the working tree as it found it.
      - name: Check the lockfiles
        run: npm run lockfiles:check
